# API — nginx apenas como tradutor HTTP → FastCGI.
#
# O alvo `prod` do docker/api/Dockerfile é php-fpm na porta 9000. php-fpm não
# fala HTTP, então sem alguém na frente nenhum navegador alcança a API.
#
# Não há try_files nem root compartilhado de propósito: a API devolve só JSON e
# o único arquivo em public/ é o index.php. Mandar tudo direto para o FastCGI
# dispensa montar o código também neste container — um volume a menos e um
# acoplamento a menos entre os dois serviços.

server {
    listen 80;
    server_name _;

    # Igual ao post_max_size do PHP, para o nginx recusar antes e com mensagem
    # própria em vez de deixar o corpo chegar pela metade no PHP.
    client_max_body_size 8m;

    # Não anuncia a versão do nginx.
    server_tokens off;

    location / {
        fastcgi_pass  api:9000;
        include       fastcgi_params;

        # fastcgi_params já entrega REQUEST_URI, REQUEST_METHOD, CONTENT_TYPE,
        # REMOTE_ADDR e os HTTP_* — exatamente o que Request::fromGlobals() lê.
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /app/public;

        # A API define os próprios cabeçalhos de segurança; o X-Powered-By do
        # PHP não acrescenta nada além da versão para quem faz reconhecimento.
        fastcgi_hide_header X-Powered-By;

        fastcgi_read_timeout 30s;
    }
}
