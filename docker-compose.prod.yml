# Stack de produção.
#
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
#
# Este arquivo NÃO estende o docker-compose.yml, de propósito. Aquele carrega
# APP_ENV=local, APP_DEBUG=true, Mailpit, Adminer e limites de rate afrouxados.
# Herdar dele e desfazer item por item é como se publica um ambiente de
# desenvolvimento sem querer — basta esquecer uma linha.
#
# A sintaxe ${VAR:?mensagem} faz o compose recusar subir quando falta uma
# variável obrigatória. É melhor não subir do que subir errado e descobrir
# depois, com o site no ar.

name: portifolio-prod

services:
  # ------------------------------------------------------------------
  #  Banco
  # ------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?defina no .env}"
      MYSQL_DATABASE: "${DB_NAME:?defina no .env}"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem `ports`. O banco só existe dentro da rede do compose; publicar 3306
    # na internet é o erro de infraestrutura mais comum e mais caro que existe.
    networks: [interna]

  # ------------------------------------------------------------------
  #  API
  # ------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: prod
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_NAME: portifolio-api
      APP_VERSION: "${APP_VERSION:-2.0.0}"
      APP_URL: "${APP_URL:?ex.: https://api.gustavohsmachado.com.br}"
      FRONTEND_URL: "${FRONTEND_URL:?ex.: https://gustavohsmachado.com.br}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?mesma origem do FRONTEND_URL}"
      APP_FORCE_HTTPS: "true"
      APP_SECURE_COOKIES: "true"
      APP_KEY: "${APP_KEY:?gere com openssl rand -hex 32}"
      JWT_SECRET: "${JWT_SECRET:?gere com openssl rand -hex 32}"

      # IP fixo do proxy, casando com o ipv4_address lá embaixo.
      #
      # Request::resolveIp() compara REMOTE_ADDR com esta lista por igualdade
      # exata — não entende faixa CIDR. Com IP dinâmico do Docker, a lista
      # deixaria de casar em silêncio na primeira recriação do container, e o
      # rate limit voltaria a contar o mundo inteiro contra um IP só.
      TRUSTED_PROXIES: 172.30.0.10

      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: "${DB_USER:-root}"
      DB_PASS: ${DB_ROOT_PASSWORD}

      MAIL_HOST: "${MAIL_HOST:?servidor SMTP}"
      MAIL_PORT: "${MAIL_PORT:-465}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-ssl}"
      MAIL_USERNAME: "${MAIL_USERNAME:?endereço completo da caixa}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:?senha da caixa}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:?precisa ser igual ao MAIL_USERNAME}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Gustavo Henrique}"
      # Vazio descarta a mensagem endereçada a domínio reservado em vez de
      # desviá-la: em produção não existe servidor de captura para onde desviar.
      MAIL_SANDBOX_HOST: ""

      ADMIN_EMAIL: "${ADMIN_EMAIL:?a conta que abre o painel}"
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-true}"

      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0.2}"

      # Nenhum RATE_LIMIT_* aqui, de propósito: sem sobrescrita valem os padrões
      # do código, que já são os valores de produção. Ver RateLimit::STRICT_RULES.
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]

  # ------------------------------------------------------------------
  #  Migrações — roda e sai
  # ------------------------------------------------------------------
  #
  # Serviço separado, e não entrypoint do container da API. Com mais de uma
  # réplica, N containers subindo ao mesmo tempo aplicariam a mesma migração em
  # paralelo. Aqui a migração é um passo explícito do deploy:
  #
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: prod
    profiles: [manutencao]
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: "${DB_USER:-root}"
      DB_PASS: ${DB_ROOT_PASSWORD}
    command: ["php", "database/migrate.php"]
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]

  # ------------------------------------------------------------------
  #  Site
  # ------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: prod
      # ATENÇÃO: `args`, não `environment`.
      #
      # O Next substitui as variáveis NEXT_PUBLIC_* DENTRO do bundle, no momento
      # do build. Passá-las em tempo de execução não tem efeito nenhum — a
      # imagem já saiu com o valor congelado. Foi exatamente esse o defeito que
      # a homologação de 29/08/2026 encontrou: a imagem de produção chamava
      # http://127.0.0.1:8000 e a CSP liberava só localhost.
      args:
        NEXT_PUBLIC_API_URL: "${APP_URL:?}"
        NEXT_PUBLIC_SITE_URL: "${FRONTEND_URL:?}"
    restart: always
    environment:
      NODE_ENV: production
      # Lido em tempo de execução pelo lado servidor do Next: as chamadas
      # internas cortam caminho pela rede do compose em vez de sair para a
      # internet e voltar.
      API_INTERNAL_URL: http://proxy
    depends_on: [api]
    networks: [interna]

  # ------------------------------------------------------------------
  #  Proxy
  # ------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks:
      interna:
        # Precisa ser fixo: é este endereço que vai em TRUSTED_PROXIES.
        ipv4_address: 172.30.0.10

volumes:
  db-data:

networks:
  interna:
    ipam:
      config:
        - subnet: 172.30.0.0/24
